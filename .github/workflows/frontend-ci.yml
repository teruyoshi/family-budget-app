name: Frontend CI

on:
  pull_request:
    branches: [develop, main, 'feature/**', 'Issue#**']
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

jobs:
  frontend-tests:
    name: Frontend Tests & Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 並列実行戦略（必要に応じてテスト分割）
        test-type: [full] # 将来的な分割対応準備
    
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run quality checks
        run: |
          echo "🔍 統合品質チェック開始..."
          
          echo "📐 Prettierフォーマットチェック"
          npm run format:check
          
          echo "🎯 TypeScript型チェック"  
          npm run typecheck
          
          echo "🔧 ESLintチェック"
          npm run lint
          
          echo "✅ 全品質チェック完了"
      
      - name: Run tests with coverage
        run: |
          # テスト削減後の最適設定（Phase 3: CI最適化）
          npm run test:ci -- --maxWorkers=75%
        env:
          CI: true
        timeout-minutes: 8  # 15分 → 8分に短縮（テスト削減効果を反映）
      
      - name: Build application
        run: npm run build
      
      - name: Upload coverage reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frontend/coverage/
          retention-days: 30